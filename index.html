<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f6b57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plan NanuVI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Plan NanuVI">
  <link rel="apple-touch-icon" sizes="180x180"
        href="https://villalbanavarrofernando-debug.github.io/plan-running/launcher/icon-180.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192"
        href="https://villalbanavarrofernando-debug.github.io/plan-running/launcher/icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512"
        href="https://villalbanavarrofernando-debug.github.io/plan-running/launcher/icon-512.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <title>Plan NanuVI</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0f6b57;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;color:white;text-align:center;padding:24px;box-sizing:border-box}
    .card{max-width:360px}
    img{width:120px;height:120px;border-radius:26px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
    h1{font-size:26px;margin:18px 0 8px}
    p{opacity:.9;font-size:16px;line-height:1.45;margin:8px 0}
    .hint{font-size:14px;opacity:.75;margin-top:14px}
    a{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:12px;background:#fff;color:#0f6b57;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png?v=2" alt="Plan NanuVI">
    <h1>Plan NanuVI</h1>
    <p id="message">Añade esta pantalla al inicio para usar el icono de Plan NanuVI.</p>
    <p class="hint" id="hint">En iPhone: Compartir → Añadir a pantalla de inicio → Abrir como app web.</p>
    <a id="enter" href="https://script.google.com/macros/s/AKfycbwrTSR_5kIjrllHKz6EU746SEck0c6QhUqdFFUZme3n1LjreewU03xjcKSfzyEd3OuJ/exec">Entrar ahora</a>
  </div>
  <script>
    const target = "https://script.google.com/macros/s/AKfycbwrTSR_5kIjrllHKz6EU746SEck0c6QhUqdFFUZme3n1LjreewU03xjcKSfzyEd3OuJ/exec";
    const standalone =
      window.navigator.standalone === true ||
      window.matchMedia('(display-mode: standalone)').matches;

    if (standalone) {
      document.getElementById('message').textContent = 'Abriendo tu plan de entrenamiento…';
      document.getElementById('hint').style.display = 'none';
      document.getElementById('enter').style.display = 'none';
      setTimeout(() => window.location.replace(target), 300);
    }
  </script>
</body>
</html>
